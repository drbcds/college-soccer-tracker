<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Soccer Tracker</title>
  <meta name="description" content="Live scores, results, box scores and player stats for NCAA Division I and II and NJCAA junior college men's soccer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2B24'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><circle cx="16" cy="16" r="8"/><circle cx="16" cy="16" r="2.5"/></svg>
        <span>College Soccer Tracker</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="scores">Scores</a>
        <a href="#/standings" data-nav="standings">Standings</a>
        <a href="#/leaders" data-nav="leaders">Leaders</a>
      </nav>
      <div class="search">
        <input id="q" type="search" placeholder="Search teams or players" autocomplete="off" aria-label="Search teams or players">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">
    <p>Data from NCAA.com and NJCAA.org public feeds, refreshed every few minutes. <span id="updated"></span></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
