name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch samples
        run: python tools/probe.py /tmp/samples
      - name: Publish samples to the samples branch
        run: |
          cd /tmp/samples
          git init -q -b samples
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Probe samples ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" samples
